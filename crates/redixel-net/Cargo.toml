[package]
name = "redixel-net"
description = "Platform-agnostic networking transports for the Redixel engine."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Internal crates
redixel-core = { workspace = true }

# External crates
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wtransport = { workspace = true, features = ["dangerous-configuration"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net"] }
bytes = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "WebTransport",
    "WebTransportOptions",
    "WebTransportHash",
    "WebTransportBidirectionalStream",
    "WebTransportSendStream",
    "WebTransportReceiveStream",
    "WebTransportDatagramDuplexStream",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "WritableStream",
    "WritableStreamDefaultWriter",
] }