[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "sprite"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.game]
title = "Sprite"
description = "A texture pipeline test: a PNG-mapped crate spinning head-on, its faces UV-mapped and resolved by the depth buffer."
tags = ["3D", "Rendering", "Textures"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel" }

# External crates
log = "0.4"
