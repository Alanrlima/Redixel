[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "triangle_3d"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.game]
title = "Triangle 3D"
description = "A rotating 3D triangle demonstrating mathematical projections, Z-sorting, and 3D transformations."
tags = ["3D", "Math", "Projection"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel" }

# External crates
log = "0.4"

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
console_log = "1.0"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.31.0-beta.2", features = ["android-native-activity"] }
