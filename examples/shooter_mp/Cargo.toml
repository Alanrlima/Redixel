[workspace]
resolver = "2"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "shooter_mp"
version = "0.1.0"
edition = "2024"
publish = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel", features = ["net"] }

# External crates
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
