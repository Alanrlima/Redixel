[workspace]
resolver = "2"

[package]
name = "shooter_mp"
version = "0.1.0"
edition = "2024"
publish = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Internal crates
redixel = { path = "../../crates/redixel", features = ["net"] }

# External crates
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
winit = { version = "0.31.0-beta.2", features = ["android-native-activity"] }