[workspace]
members = ["crates/*", "tools/builder"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Redixel Core Team"]
repository = "https://github.com/RedixelCoreTeam"

[workspace.dependencies]
# Internal crates
redixel = { path = "crates/redixel" }
redixel-math = { path = "crates/redixel-math" }
redixel-core = { path = "crates/redixel-core" }
redixel-platform = { path = "crates/redixel-platform" }
redixel-renderer = { path = "crates/redixel-renderer" }
redixel-runtime = { path = "crates/redixel-runtime" }
redixel-net = { path = "crates/redixel-net" }

# External crates
env_logger = "0.11"
log = "0.4"
pollster = "1.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
winit = "0.31.0-beta.2"
wgpu = "30.0.0"
bytemuck = { version = "1.25.0", features = ["derive"] }
bytes = "1.12.0"
wtransport = { version = "0.7.1", features = ["dangerous-configuration"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "time", "net"] }
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
web-time = "1.1"